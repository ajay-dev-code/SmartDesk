<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartDesk - Ticket Submitted</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="public-header">

        <div class="public-brand">

            <div class="public-brand-icon">
                S
            </div>

            <div class="public-brand-name">
                <strong>SmartDesk</strong>
                <span>support portal</span>
            </div>

        </div>

        <a href="login.html" class="admin-login-button">
            Admin login
        </a>

    </header>


    <main class="confirmation-page">

        <div class="confirmation-card">

            <div class="success-icon">
                ✓
            </div>

            <h1>Ticket submitted successfully</h1>

            <p class="confirmation-text">
                Thank you for contacting SmartDesk.
                Your support request has been received.
            </p>


            <div class="reference-box">

                <span>Your reference number</span>

                <strong id="referenceNumber">

                </strong>

                <p>
                    Keep this reference number for future follow-up.
                </p>

            </div>


            <div class="confirmation-actions">

                <a href="index.html" class="submit-ticket-button">
                    Raise another ticket
                </a>

            </div>

        </div>

    </main>
    <script>
        const params = new URLSearchParams(window.location.search);

        const referenceNumber = params.get("reference");

        document.getElementById("referenceNumber").textContent =
            referenceNumber || "Unavailable";
    </script>

</body>

</html>
