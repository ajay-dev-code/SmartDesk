<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartDesk - Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <div class="login-page">


        <div class="login-card">


            <!-- Brand -->

            <div class="brand">

                <div class="brand-icon">
                    S
                </div>

                <div>

                    <h1>
                        SmartDesk
                    </h1>

                    <p>
                        Support Ticket Management
                    </p>

                </div>

            </div>



            <!-- Login Heading -->

            <div class="login-heading">

                <h2>
                    Welcome back
                </h2>

                <p>
                    Sign in to your administrator account
                </p>

            </div>



            <!-- Login Form -->

            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@smartdesk.com"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <div
                    id="loginMessage"
                    class="login-message"
                ></div>



                <button
                    type="submit"
                    class="login-button"
                >
                    Sign in
                </button>


            </form>



            <!-- Footer -->

            <div class="login-footer">

                <span>
                    SmartDesk
                </span>

                <span>
                    •
                </span>

                <span>
                    Admin Portal
                </span>

            </div>


        </div>



        <!-- Back to Public Form -->

        <a
            href="index.html"
            class="back-to-public"
        >
            ← Back to public ticket form
        </a>


    </div>


    <script src="js/auth.js"></script>

</body>

</html>
